# workflows/feature-development.yaml
name: 功能开发工作流
version: "1.0"
trigger:
  feishu: "/aiflow 实现 <feature>"
  cli: "npx aiflow \"<feature>\""

stages:
  - name: 需求分析
    agent: architect
    model: sonnet
    skills: [brainstorming]
    input: 飞书需求文档 / CLI 输入
    output: 结构化需求文档（User Story + 验收标准）
    human_gate:
      title: "需求确认"
      notify: feishu
      actions: [approve, reject, modify]

  - name: 架构设计
    agent: designer
    model: sonnet
    skills: [writing-plans, subagent-driven-development]
    input: 结构化需求文档
    output: 架构设计文档 + 接口定义 + 任务拆解
    human_gate:
      title: "方案审批"
      notify: feishu
      actions: [approve, reject, modify]

  - name: 编码实现
    agent: coder
    model: sonnet
    skills: [test-driven-development, executing-plans, subagent-driven-development]
    input: 任务列表
    output: 代码 + 单元测试 + Git 提交
    auto_continue: true

  - name: E2E 测试
    agent: tester
    model: sonnet
    skills: [test-driven-development, e2e-runner]
    input: 功能代码 + 需求文档
    output: Playwright 测试 + 测试报告
    on_failure:
      route_to: coder
      max_retries: 3

  - name: 代码审查
    agent: reviewer
    model: sonnet
    skills: [requesting-code-review, receiving-code-review]
    input: git diff + 架构设计文档
    output: 四维审查报告
    human_gate:
      title: "审查通过"
      notify: feishu
      actions: [approve, reject]

  - name: 合并部署
    agent: orchestrator
    model: haiku
    skills: [finishing-a-development-branch, using-git-worktrees]
    output: MR 合并 + DevOps 部署触发
    human_gate:
      title: "部署确认"
      notify: feishu
      actions: [approve, reject]
